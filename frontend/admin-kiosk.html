<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/virtex-favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtex Admin • Reception Kiosk</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    /* Full-height layout: the kiosk frame fills exactly the space under the header,
       so there is one scroll area (inside the kiosk) and no outer page scrollbar. */
    body.kiosk-page .admin-main-wrap { height: 100vh; min-height: 0; overflow: hidden; }
    body.kiosk-page .admin-body { flex: 1 1 auto; min-height: 0; padding: 0; gap: 0; max-width: none; }
    body.kiosk-page .admin-content-wrap {
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.5rem 1.25rem !important;
      max-width: 1400px;
      margin: 0 auto;
    }

    .kiosk-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 0.85rem;
      flex-shrink: 0;
    }
    .kiosk-toolbar h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 2px 0;
    }
    .kiosk-toolbar p { font-size: 0.82rem; color: var(--text-gray); margin: 0; }
    .kiosk-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .kiosk-live-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--green, #00e676); box-shadow: 0 0 8px rgba(0, 230, 118, 0.7);
    }

    .kiosk-frame-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 420px;
      width: 100%;
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .kiosk-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0b0d14;
    }

    @media (max-width: 768px) {
      /* On small screens fall back to normal page scrolling with a tall frame */
      body.kiosk-page .admin-main-wrap { height: auto; overflow: visible; }
      body.kiosk-page .admin-content-wrap { height: auto; }
      .kiosk-frame-wrap { flex: none; height: 80vh; }
    }
    .kiosk-frame-status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 0.9rem;
      pointer-events: none;
    }
    .kiosk-frame-status.hidden { display: none; }
  </style>
</head>

<body class="kiosk-page">
  <div class="admin-shell">
    <!-- Sidebar Navigation (rendered by adminSidebarNav.js) -->
    <aside class="admin-sidebar" id="admin-sidebar" role="navigation" aria-label="Admin Navigation">
      <div class="sidebar-header">
        <svg class="sidebar-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="9" fill="#13161f" stroke="#00e676" stroke-width="1.6"/><path d="M7.2 6.8h4.6L16 17.2V22h-2.1z" fill="#00e676"/><path d="M16 17.2l4.2-10.4h4.6L18.1 22H16z" fill="#22d3ee"/><path d="M6.2 25.6h5.4l1.3-2.3 1.7 4 1.4-1.7h9.8" stroke="#00e676" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="sidebar-brand">
          <h2>VIRTEX</h2>
          <span class="sidebar-brand-badge">TRAINER / ADMIN CONSOLE</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <!-- Rendered dynamically by adminSidebarNav.js -->
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-card" id="sidebar-user-card" role="button" tabindex="0">
          <div class="user-avatar avatar-owner" id="sidebar-user-avatar">
            <span id="sidebar-user-initials">NB</span>
          </div>
          <div class="user-details">
            <div class="user-name-row">
              <span class="user-display-name" id="sidebar-user-fullname">Nandan.B</span>
              <span class="role-badge-pill role-owner" id="sidebar-role-pill">OWNER</span>
            </div>
            <span class="user-handle" id="sidebar-user-handle">@nandanb449</span>
          </div>
          <button class="btn-logout-sidebar" id="btn-logout" title="Log out" aria-label="Log out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Application Canvas -->
    <div class="admin-main-wrap">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" aria-label="Toggle Navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="topbar-brand">
            <span class="topbar-title">Reception Kiosk</span>
            <span class="badge badge-green font-mono text-xs">Live Kiosk</span>
          </div>
        </div>
        <div class="topbar-right">
          <!-- Routine Quick Punch Group Mounted by topbarRoutineNav.js -->
        </div>
      </header>

      <main class="admin-body">
        <div class="admin-content-wrap">
          <div class="kiosk-toolbar">
            <div>
              <p style="display: flex; align-items: center; gap: 8px;"><span class="kiosk-live-dot" title="Live"></span> Live member-facing kiosk — check-ins and enquiries made here are real.</p>
            </div>
            <div class="kiosk-actions">
              <button type="button" class="btn btn-outline" id="btn-reload-kiosk">🔄 Reload</button>
              <a href="kiosk.html" target="_blank" rel="noopener" class="btn btn-green" style="text-decoration: none;">↗ Open Full Screen</a>
            </div>
          </div>

          <div class="kiosk-frame-wrap">
            <div class="kiosk-frame-status" id="kiosk-frame-status">
              <div style="font-size: 2rem;">🖥️</div>
              <div>Loading reception kiosk…</div>
            </div>
            <iframe id="kiosk-frame" src="kiosk.html" title="Reception Kiosk"
              allow="microphone; camera; autoplay"></iframe>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { adminApi } from './js/admin/adminApi.js';

    // Kiosk frame: hide the loading message once loaded; reload button
    const frame = document.getElementById('kiosk-frame');
    const status = document.getElementById('kiosk-frame-status');
    // Scale the kiosk down when the frame is narrower than the kiosk layout (avoids a
    // horizontal scrollbar inside the frame).
    function fitKiosk() {
      try {
        const root = frame.contentDocument?.documentElement;
        if (!root) return;
        root.style.colorScheme = 'dark'; // dark scrollbars inside the frame
        root.style.zoom = '';
        root.style.overflowX = '';
        const natural = root.scrollWidth;
        const available = frame.clientWidth;
        if (natural > available + 1) {
          root.style.zoom = String(Math.max(0.6, available / natural));
          // content now fits; hide the leftover horizontal scrollbar that zoom leaves behind
          root.style.overflowX = 'hidden';
        }
      } catch (e) { /* cross-origin or not ready */ }
    }

    frame.addEventListener('load', () => {
      status.classList.add('hidden');
      try {
        // Kiosk links to the portal/admin should replace the whole console, not load inside the frame
        frame.contentDocument.querySelectorAll('a[href]').forEach((a) => {
          const href = a.getAttribute('href') || '';
          if (href.startsWith('/') || href.endsWith('.html')) a.target = '_top';
        });
      } catch (e) { /* ignore */ }
      fitKiosk();
      setTimeout(fitKiosk, 600); // re-fit after kiosk finishes rendering dynamic content
    });
    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitKiosk, 150); });
    document.getElementById('btn-reload-kiosk').addEventListener('click', () => {
      status.classList.remove('hidden');
      frame.src = 'kiosk.html';
    });

    // Sidebar user card from the stored admin session
    try {
      const u = adminApi.getStoredUser();
      if (u) {
        const name = (u.fullName || u.full_name || u.name || u.username || 'Admin').trim();
        const role = (u.role || 'owner').toLowerCase();
        const handle = (u.username || u.email || '').split('@')[0];
        const words = name.replace(/[^a-zA-Z0-9\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
        const initials = words.length >= 2 ? (words[0][0] + words[1][0]) : (words[0] || 'AD').slice(0, 2);
        document.getElementById('sidebar-user-fullname').textContent = name;
        document.getElementById('sidebar-user-initials').textContent = initials.toUpperCase();
        if (handle) document.getElementById('sidebar-user-handle').textContent = `@${handle}`;
        const pill = document.getElementById('sidebar-role-pill');
        pill.textContent = role.toUpperCase();
        pill.className = `role-badge-pill role-${role}`;
        document.getElementById('sidebar-user-avatar').className = `user-avatar avatar-${role}`;
      }
    } catch (e) { /* keep defaults */ }

    document.getElementById('btn-logout').addEventListener('click', async (e) => {
      e.stopPropagation();
      await adminApi.logout();
      window.location.href = 'index.html';
    });
    document.getElementById('sidebar-user-card').addEventListener('click', () => {
      window.location.href = 'admin-profile.html';
    });
  </script>
  <script type="module" src="js/components/adminSidebarNav.js"></script>
  <script type="module" src="js/components/topbarRoutineNav.js"></script>
</body>

</html>
